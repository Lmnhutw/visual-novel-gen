  <text x="803.7544999999999" y="410.376" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Handoff Brief: mang context cần thiết sang chương mới</text>
</g>
<g class="node" data-id="Summary" data-label="LLM tạo summary để lưu vào Chapter" data-shape="rectangle">
  <rect x="153.98349999999994" y="735.8259999999998" width="257.5809999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
