<polyline class="edge" data-from="Commit" data-to="Summary" data-style="dotted" data-arrow-start="false" data-arrow-end="true" data-label="Lệnh summarize riêng" points="174.14449999999994,712.4259999999999 174.14449999999994,812.7259999999999" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
