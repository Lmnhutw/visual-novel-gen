</g>
<g class="node" data-id="Summary" data-label="LLM tạo summary để lưu vào Chapter" data-shape="rectangle">
  <rect x="45.353999999999985" y="812.7259999999999" width="257.5809999999999" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
