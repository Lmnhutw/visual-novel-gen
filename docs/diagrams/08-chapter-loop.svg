<polyline class="edge" data-from="Finish" data-to="Complete" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="end_chapter hoặc đủ điều kiện auto-advance" points="197.5469166666666,165.0445 197.5469166666666,218.726 622.8044999999998,218.726 622.8044999999998,291.026" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
