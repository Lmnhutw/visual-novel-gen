</g>
<g class="node" data-id="Generate" data-label="Generate with Brief and up to 3 recent Scenes" data-shape="rectangle">
  <rect x="149.42399999999986" y="500.23699999999997" width="304.264" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
