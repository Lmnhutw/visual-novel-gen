services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: visual_novel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visual_novel"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    command: >
      sh -c "npx prisma migrate deploy &&
      npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/visual_novel?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/visual_novel?schema=public
      WATCHPACK_POLLING: "true"
    env_file:
      - env/.env
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules

  worker:
    build:
      context: .
    command: >
      sh -c "npx prisma migrate deploy &&
      npm run generation:worker"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/visual_novel?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/visual_novel?schema=public
    env_file:
      - env/.env
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules

volumes:
  app_node_modules:
  postgres_data:
